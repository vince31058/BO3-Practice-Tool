# Builds the Practice Tool on a clean Windows machine on every push:
#   1. builds BO3 Practice Tool.exe (Release x64), so a push that breaks the app shows a red X
#   2. uploads the built app under the run's "Artifacts"
# The in-game script isn't compiled here: the compiler stops and waits for a key press,
# which would hang the run (it's compiled on your PC by Vin.bat instead).
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: cmd
        run: |
          rem make sure the runner's vcpkg knows the baseline pinned in vcpkg.json
          git -C "%VCPKG_INSTALLATION_ROOT%" pull --quiet
          call "%VCPKG_INSTALLATION_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
          "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" integrate install

      - uses: microsoft/setup-msbuild@v2

      - name: Build exe
        shell: cmd
        run: msbuild "BO3 Practice Tool.sln" /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Package
        shell: cmd
        run: |
          robocopy "x64\Release" "dist\BO3 Practice Tool" /e /xf *.pdb *.iobj *.ipdb *.lib *.exp *.ilk
          if %errorlevel% geq 8 exit /b 1
          exit /b 0

      - uses: actions/upload-artifact@v4
        with:
          name: BO3-Practice-Tool
          path: dist/
